name: Android APK and Release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.channel }} APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: stable
            variant: Standalone
            directory: standalone
            filename: app.apk
          - channel: debug
            variant: Debug
            directory: debug
            filename: Nyarugram-debug.apk
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set dependency directory
        run: echo "DEPENDENCY_ROOT=$RUNNER_TEMP/nyarugram-dependencies" >> "$GITHUB_ENV"

      - name: Check out pinned native sources
        shell: bash
        run: |
          git submodule init
          git config submodule.TMessagesProj/jni/third_party/libyuv.url https://github.com/lemenkov/libyuv.git
          git submodule update --depth 1 --jobs 4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - uses: actions/cache@v4
        with:
          path: ${{ env.DEPENDENCY_ROOT }}
          key: android-pinned-${{ runner.os }}-${{ hashFiles('Tools/Prepare-AndroidCI.py') }}

      - name: Prepare verified dependencies
        run: python Tools/Prepare-AndroidCI.py --dependency-root "$DEPENDENCY_ROOT"

      - name: Verify bundled M49
        shell: pwsh
        run: ./Tools/Verify-BotgramM49.ps1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          gradle --no-daemon --console=plain --max-workers=2 \
            '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            -PbotgramDependencyRoot="$DEPENDENCY_ROOT" \
            :TMessagesProj_AppStandalone:assembleAfat${{ matrix.variant }}

      - name: Verify and package APK
        env:
          CHANNEL: ${{ matrix.channel }}
          APK_PATH: TMessagesProj_AppStandalone/build/outputs/apk/afat/${{ matrix.directory }}/${{ matrix.filename }}
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$APK_PATH"
          "$tools/aapt" dump badging "$APK_PATH" > apk-badging.txt
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '\r')
          code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | tr -d '\r')
          package=$(sed -n 's/^APP_PACKAGE=//p' gradle.properties | tr -d '\r')
          grep -F "package: name='$package' versionCode='$((code * 10 + 9))' versionName='$version'" apk-badging.txt
          if [ "$CHANNEL" = debug ]; then
            grep -q '^application-debuggable' apk-badging.txt
          elif grep -q '^application-debuggable' apk-badging.txt; then
            echo 'Stable APK must disable debugging' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" "dist/Nyarugram-$CHANNEL.apk"
          cp apk-badging.txt "dist/$CHANNEL-build-info.txt"
          printf '\nCommit %s\n' "$GITHUB_SHA" >> "dist/$CHANNEL-build-info.txt"
          cd dist
          sha256sum "Nyarugram-$CHANNEL.apk" > "Nyarugram-$CHANNEL.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Nyarugram-${{ matrix.channel }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: Nyarugram-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Publish both APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '\r')
          tag="v${version}-${GITHUB_SHA:0:12}"
          (cd dist && sha256sum --check ./*.sha256)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "Nyarugram $version (${GITHUB_SHA:0:12})" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest
